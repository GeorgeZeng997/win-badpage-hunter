name: Build & Package Multi-Platform GUI Application

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # 1. Windows x64 Standalone GUI (.exe + .zip)
  # ===========================================================================
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: "pip"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Smoke Test Modules
        shell: pwsh
        run: |
          python -m badpage_hunter --help
          python -c "import badpage_hunter, badpage_hunter.gui; print('Windows modules OK:', badpage_hunter.__version__)"

      - name: Package Windows Executable (PyInstaller)
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --uac-admin `
            --name "win-badpage-hunter-windows-x64" `
            --icon "assets/icon.ico" `
            --add-data "assets/icon.ico;assets" `
            --exclude-module matplotlib `
            --exclude-module scipy `
            --exclude-module pandas `
            --exclude-module PIL `
            --exclude-module PyQt5 `
            run_app.py

      - name: Create Windows Release Archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/release-assets | Out-Null
          New-Item -ItemType Directory -Force -Path dist/bundle | Out-Null
          Copy-Item dist/win-badpage-hunter-windows-x64.exe dist/release-assets/win-badpage-hunter-windows-x64.exe
          Copy-Item dist/win-badpage-hunter-windows-x64.exe dist/bundle/win-badpage-hunter.exe
          Copy-Item README.md dist/bundle/
          Copy-Item LICENSE dist/bundle/
          Compress-Archive -Path dist/bundle/* -DestinationPath dist/release-assets/win-badpage-hunter-windows-x64.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-x64
          path: dist/release-assets/*
          if-no-files-found: error

  # ===========================================================================
  # 2. Linux x64 Standalone GUI & CLI Binary (.tar.gz)
  # ===========================================================================
  build-linux:
    name: Build Linux x64 (Binary & .tar.gz)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Smoke Test Modules
        shell: bash
        run: |
          python -m badpage_hunter --help
          python -c "import badpage_hunter, badpage_hunter.hunter, badpage_hunter.dmp_analyzer, badpage_hunter.bcd_manager, badpage_hunter.pfn_resolver; print('Linux modules OK:', badpage_hunter.__version__)"

      - name: Package Linux Executable (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile \
            --name "win-badpage-hunter-linux-x64" \
            --add-data "assets/icon.ico:assets" \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module PIL \
            --exclude-module PyQt5 \
            run_app.py

      - name: Create Linux Release Archive
        shell: bash
        run: |
          mkdir -p dist/release-assets dist/bundle
          chmod +x dist/win-badpage-hunter-linux-x64
          cp dist/win-badpage-hunter-linux-x64 dist/release-assets/win-badpage-hunter-linux-x64
          cp dist/win-badpage-hunter-linux-x64 dist/bundle/win-badpage-hunter
          cp README.md LICENSE dist/bundle/
          tar -czvf dist/release-assets/win-badpage-hunter-linux-x64.tar.gz -C dist/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-x64
          path: dist/release-assets/*
          if-no-files-found: error

  # ===========================================================================
  # 3. macOS Apple Silicon (ARM64) Standalone App & Binary (.tar.gz)
  # ===========================================================================
  build-macos:
    name: Build macOS ARM64 (.app & .tar.gz)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (macOS)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install -e .

      - name: Smoke Test Modules
        shell: bash
        run: |
          python -m badpage_hunter --help
          python -c "import badpage_hunter, badpage_hunter.hunter, badpage_hunter.dmp_analyzer, badpage_hunter.bcd_manager, badpage_hunter.pfn_resolver; print('macOS modules OK:', badpage_hunter.__version__)"

      - name: Package macOS Application & Binary (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "win-badpage-hunter-macos-arm64" \
            --icon "assets/icon.ico" \
            --add-data "assets/icon.ico:assets" \
            --exclude-module matplotlib \
            --exclude-module scipy \
            --exclude-module pandas \
            --exclude-module PIL \
            --exclude-module PyQt5 \
            run_app.py

      - name: Create macOS Release Archive
        shell: bash
        run: |
          mkdir -p dist/release-assets dist/bundle
          chmod +x dist/win-badpage-hunter-macos-arm64
          cp -R dist/win-badpage-hunter-macos-arm64.app dist/bundle/ 2>/dev/null || true
          cp dist/win-badpage-hunter-macos-arm64 dist/bundle/win-badpage-hunter
          cp README.md LICENSE dist/bundle/
          tar -czvf dist/release-assets/win-badpage-hunter-macos-arm64.tar.gz -C dist/bundle .

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-arm64
          path: dist/release-assets/*
          if-no-files-found: error

  # ===========================================================================
  # 4. Publish Unified Multi-Platform GitHub Release
  # ===========================================================================
  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-windows, build-linux, build-macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Generate Unified SHA256SUMS.txt
        shell: bash
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: rel_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VER=$(python3 -c "import badpage_hunter; print(badpage_hunter.__version__)")
            TAG="v${VER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $TAG"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_tag.outputs.tag }}
          name: "Win-BadPage-Hunter ${{ steps.rel_tag.outputs.tag }} (Windows / Linux / macOS)"
          generate_release_notes: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
